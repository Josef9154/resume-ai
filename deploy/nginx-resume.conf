location = /resume { return 301 /JosephRochelle/; }
location /resume/ { return 308 /JosephRochelle/; }
location = /JosephRochelle { return 301 /JosephRochelle/; }
location = /JosephRochelle/chat {
    limit_req zone=resume_chat burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8200/chat;
    proxy_read_timeout 130s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /JosephRochelle/ {
    proxy_pass http://127.0.0.1:8200/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
